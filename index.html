<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description"
        content="Chwazi-style random picker: put fingers on the screen and let it choose one, an order, or teams." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chwazi" />
    <title>Chwazi &mdash; Finger Chooser</title>

    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="assets/manifest.json" />
    <link data-trunk rel="copy-file" href="assets/icon.svg" />
    <link data-trunk rel="copy-file" href="assets/sw.js" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />

    <!-- Inlined at build (critical CSS, no extra request); source in styles.css. -->
    <link data-trunk rel="inline" href="styles.css" />
</head>

<body>
    <canvas id="c"></canvas>

    <div id="ui">
        <div class="seg">
            <button data-mode="one" class="active">Pick&nbsp;One</button>
            <button data-mode="order">Order</button>
            <button data-mode="groups">Teams</button>
        </div>
        <div id="grp" class="grp hidden">
            <button id="gminus" aria-label="fewer teams">&minus;</button>
            <span id="gcount">2</span>
            <button id="gplus" aria-label="more teams">+</button>
            <span class="grplabel">teams</span>
        </div>
    </div>

    <div id="dots">
        <button id="dminus" aria-label="remove a dot">&minus;</button>
        <span id="dcount">0</span>
        <button id="dplus" aria-label="add a dot">+</button>
    </div>

    <!-- Page bootstrap scripts, inlined at build in this order (source in js/).
         They run here, after the DOM above exists, exactly as before. -->
    <link data-trunk rel="inline" href="js/viewport-fit.js" />
    <link data-trunk rel="inline" href="js/no-double-tap.js" />
    <link data-trunk rel="inline" href="js/register-sw.js" />
</body>

</html>
