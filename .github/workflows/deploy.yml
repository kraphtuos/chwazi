name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch.
  push:
    branches: [main]
  # ...and allow a manual run from the Actions tab.
  workflow_dispatch:

# No workflow-wide grants: each job requests exactly the permissions it needs.
permissions: {}

# Only one Pages deploy at a time; let an in-progress run finish (don't cancel
# a deploy midway).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          # dtolnay's default profile is minimal; pull in the lint/format tools.
          components: clippy, rustfmt

      # Cache the cargo registry + build so only the first run pays full build.
      - uses: Swatinem/rust-cache@v2

      # Fail fast on formatting or lint problems before spending time on the
      # wasm build + deploy. `-D warnings` makes any clippy warning an error.
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      # Trunk drives the build; it auto-downloads the matching wasm-bindgen and
      # wasm-opt (binaryen) itself, so nothing else needs installing.
      # Pinned so a surprise Trunk release can't break deploys; matches the
      # version used for local development. The installer action is pinned to
      # a commit SHA (and the binstall binary to the same release), since it
      # runs arbitrary code in a job that feeds the production deploy.
      - name: Install Trunk
        uses: cargo-bins/cargo-binstall@422f3094be6a0843857aa008b499caaf6bce0da8 # v1.24.0
        with:
          version: 1.24.0
      # --force reinstalls even when rust-cache restores cargo's install
      # metadata (.crates.toml) claiming trunk is already present: without it
      # binstall skips the install ("already installed") while the actual
      # ~/.cargo/bin/trunk binary is missing, so the Build step below fails
      # with "trunk: command not found". Cold caches happen to work, which is
      # why this only bites on pushes after the first successful deploy.
      - run: cargo binstall -y --force trunk@0.21.14

      # Requires Pages to be enabled once by hand: Settings → Pages → Source =
      # "GitHub Actions". The API that turns it on isn't reachable from the
      # workflow's GITHUB_TOKEN (`enablement: true` fails with "Resource not
      # accessible by integration"), so there's no way to automate it here.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # A RELATIVE public URL ("./") makes the build portable: the same dist
      # works at a domain root, under any subpath, and on a project page
      # (/<repo>/) with no rebuild. An absolute base would hardcode one of
      # those and 404 everywhere else. Matches the already-relative
      # manifest.json / icon.svg / ./sw.js references in index.html.
      - name: Build
        run: trunk build --release --public-url ./

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # the deploy itself
      id-token: write # OIDC token deploy-pages authenticates with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
