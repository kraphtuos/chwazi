[package]
name = "chwazi"
version = "0.1.0"
edition = "2021"
description = "A Chwazi-style random finger picker PWA (Rust + WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"

[dependencies.web-sys]
version = "0.3.77"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "EventTarget",
    "Event",
    "PointerEvent",
    "MouseEvent",
    "DomRect",
    "Node",
    "NodeList",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
